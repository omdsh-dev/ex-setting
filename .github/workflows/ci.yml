name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The runner's default pnpm store path contains a `node_modules`
      # segment, which trips Node's native type stripping when the fabric
      # trio's prepare loads its tsdown config — move the store to a clean
      # path before the frozen install.
      - run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:self-contained
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run prepare
