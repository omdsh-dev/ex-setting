# The bundle mounts the host crawler and its browser client half together.
# The host gateway already serves every registered settings namespace; this
# bundle owns the crawler and composition editor, so its row is enabled when
# the package is installed. Browser navigation styles are installed by the
# client half directly.
- insert:
    - id: web-config-crawler
      name: '@deepseek-ai/dsh-ex-setting'
      disabled: false
