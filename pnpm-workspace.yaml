packages:
  - .

autoInstallPeers: false
strictPeerDependencies: true

# Fabric is a required peer on the host. Development uses the pinned release
# tarballs in devDependencies; release builds never copy Fabric into this package.
allowBuilds:
  esbuild: true

# Keep one top-level Cordis copy for the Fabric development tarballs, whose
# packages declare Cordis as a peer.
public-hoist-pattern[]: '*cordis*'
